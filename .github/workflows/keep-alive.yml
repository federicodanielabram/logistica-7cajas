name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 9 * * 1,4' # lunes y jueves 9am UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping de lectura a Supabase (evita pausa por inactividad)
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            "https://rwoyjovqpwqkkpekrzxr.supabase.co/rest/v1/chofer?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY"

      - name: Ping de escritura a Supabase (requiere tabla heartbeat, ver migración 007)
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            -X PATCH \
            "https://rwoyjovqpwqkkpekrzxr.supabase.co/rest/v1/heartbeat?id=eq.1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"pinged_en\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
